<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111827"><title>MeasureCam</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;overflow:hidden}#video,#canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}#canvas{touch-action:none}.top{position:fixed;top:0;left:0;right:0;z-index:4;padding:calc(14px + env(safe-area-inset-top)) 14px 12px;background:linear-gradient(#000b,transparent);display:flex;justify-content:space-between}.title{font-weight:800;font-size:18px}.status{font-size:12px;background:#0008;border-radius:20px;padding:7px 10px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000e 20%)}.panel{max-width:680px;margin:auto;background:#111827ee;border:1px solid #ffffff18;border-radius:18px;padding:12px;backdrop-filter:blur(12px)}.value{text-align:center;font-size:29px;font-weight:850;margin:2px 0 9px}.row{display:flex;gap:7px;margin-top:7px}.row>*{flex:1;min-width:0}button,input,select{width:100%;border:0;border-radius:11px;padding:11px;font:inherit}button{background:#374151;color:#fff;font-weight:750}button.primary{background:#38bdf8;color:#062235}button:disabled{opacity:.4}label{display:block;font-size:10px;color:#9ca3af;margin-bottom:4px}.help{font-size:12px;color:#cbd5e1;line-height:1.35;margin-top:8px}.screen{position:fixed;inset:0;z-index:20;background:#111827;display:grid;place-items:center;padding:22px}.box{max-width:390px;background:#1f2937;padding:22px;border-radius:20px}.box h1{margin:0 0 8px;font-size:29px}.box p{color:#cbd5e1;line-height:1.45}.error{display:none;color:#fca5a5;font-size:13px;margin-top:10px}.toast{position:fixed;top:75px;left:50%;transform:translateX(-50%);z-index:30;background:#111827ee;padding:9px 13px;border-radius:20px;font-size:13px}</style></head><body><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><div class="top"><div class="title">📏 MeasureCam</div><div id="status" class="status">Ready</div></div><div id="start" class="screen"><div class="box"><h1>Measure anything</h1><p>Open the camera, calibrate using a known-size object, then tap two points to measure.</p><button id="startBtn" class="primary">Open Camera</button><div id="error" class="error"></div></div></div><div class="bottom"><div class="panel"><div id="value" class="value">No measurement</div><div class="row"><button id="refBtn" class="primary">1. Calibrate</button><button id="measureBtn" disabled>2. Measure</button><button id="clearBtn">Clear</button></div><div class="row"><div><label>KNOWN SIZE</label><input id="known" type="number" value="100" step="0.1" min="0.001"></div><div><label>UNIT</label><select id="unit"><option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option><option value="in">in</option><option value="ft">ft</option></select></div></div><div id="help" class="help">Tap the two ends of a known-size object, such as a 100 mm ruler section.</div></div></div><script>const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let stream=null,mode='ref',pts=[],refPx=0,lastMm=null;const $=id=>document.getElementById(id);function resize(){let r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);async function startCamera(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showError('Camera access is unavailable on this device.');return}try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;await video.play();$('start').style.display='none';$('status').textContent='Camera ready';resize()}catch(e){console.error(e);showError('Camera permission was denied. Allow Camera for MeasureCam in Android settings, then reopen the app.')}}function showError(s){$('error').textContent=s;$('error').style.display='block'}$('startBtn').onclick=startCamera;function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function format(mm){let u=$('unit').value,v=mm;if(u==='cm')v=mm/10;if(u==='m')v=mm/1000;if(u==='in')v=mm/25.4;if(u==='ft')v=mm/304.8;let d=Math.abs(v)>=100?0:Math.abs(v)>=10?1:2;return v.toFixed(d)+' '+u}canvas.addEventListener('pointerdown',e=>{if(!stream)return;let r=canvas.getBoundingClientRect();pts.push({x:e.clientX-r.left,y:e.clientY-r.top});if(pts.length===2){if(mode==='ref'){let k=+$('known').value;if(!(k>0)){showError('Enter a known reference size first.');pts=[];return}refPx=dist(pts[0],pts[1]);mode='measure';pts=[];$('measureBtn').disabled=false;$('value').textContent='Reference saved ✓';$('help').textContent='Now tap the two ends of anything you want to measure.'}else{let px=dist(pts[0],pts[1]);lastMm=px*(+$('known').value/refPx);$('value').textContent=format(lastMm);$('help').textContent='Done. Tap two new points for another measurement.'}}draw()});$('refBtn').onclick=()=>{mode='ref';pts=[];refPx=0;lastMm=null;$('measureBtn').disabled=true;$('value').textContent='Set a reference';$('help').textContent='Tap the two ends of a known-size object.';draw()};$('measureBtn').onclick=()=>{if(refPx){mode='measure';pts=[];lastMm=null;$('value').textContent='Tap two points';draw()}};$('clearBtn').onclick=()=>{pts=[];lastMm=null;$('value').textContent=refPx?'Ready to measure':'No measurement';draw()};$('unit').onchange=()=>{if(lastMm)$('value').textContent=format(lastMm);draw()};function draw(){let w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);if(pts.length){ctx.strokeStyle=mode==='ref'?'#38bdf8':'#facc15';ctx.lineWidth=5;ctx.lineCap='round';if(pts.length===2){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);ctx.lineTo(pts[1].x,pts[1].y);ctx.stroke()}pts.forEach((p,i)=>{ctx.fillStyle=mode==='ref'?'#38bdf8':'#facc15';ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111827';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText(i+1,p.x,p.y+4)})}}resize();</script></body></html>
